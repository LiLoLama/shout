name: FlowLokal
options:
  bundleIdPrefix: com.inthezone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  mlxlm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  # swift-transformers auf WhisperKits Range gepinnt, damit WhisperKit und der
  # MLX-Macro-Stack im selben Binary koexistieren (siehe Package.swift-Kommentar).
  transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: 1.1.6
    maxVersion: 1.2.0
  huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0

targets:
  FlowLokal:
    type: application
    platform: macOS
    sources:
      - Sources/FlowLokal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.flowlokal
        PRODUCT_NAME: "Flow Lokal"
        MARKETING_VERSION: "0.0.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Menu-Bar-App ohne Dock-Icon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Flow Lokal nimmt dein Mikrofon auf, um Sprache lokal in Text umzuwandeln."
        # Ad-hoc-Signatur (später ggf. selbstsigniertes Zertifikat für stabile Accessibility-Freigabe)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: argmax
        product: WhisperKit
      - package: mlxlm
        product: MLXLLM
      - package: mlxlm
        product: MLXLMCommon
      - package: mlxlm
        product: MLXHuggingFace
      - package: transformers
        product: Tokenizers
      - package: huggingface
        product: HuggingFace
