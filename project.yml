name: FlowLokal
options:
  bundleIdPrefix: com.inthezone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  mlxlm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  # Explizit >= 0.31.6: erst ab dort ist mlx-swifts encuda-Hilfstool mit
  # #if os(macOS) geguardet — 0.31.5 bricht den iOS-Build (Foundation.Process).
  mlxcore:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  # swift-transformers auf WhisperKits Range gepinnt, damit WhisperKit und der
  # MLX-Macro-Stack im selben Binary koexistieren (siehe Package.swift-Kommentar).
  transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: 1.1.6
    maxVersion: 1.2.0
  huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0

targets:
  FlowLokal:
    type: application
    platform: macOS
    sources:
      - Sources/FlowLokal
      - Resources/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Nur Apple Silicon: MLX/WhisperKit laufen nicht auf Intel. arm64-only sorgt
        # dafür, dass macOS die App auf Intel-Macs gar nicht erst startet (klare
        # „nicht unterstützt"-Meldung statt Crash beim Modell-Laden).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        # Bundle-ID bewusst unverändert (com.inthezone.flowlokal), damit die
        # bestehende Accessibility-Freigabe trotz Umbenennung erhalten bleibt.
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.flowlokal
        # Datei-/Produktname ohne Punkt (sonst "shout..app"); Anzeigename mit Punkt.
        PRODUCT_NAME: "shout"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "shout."
        # Menu-Bar-App ohne Dock-Icon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "shout. nimmt dein Mikrofon auf, um Sprache lokal in Text umzuwandeln."
        INFOPLIST_KEY_NSContactsUsageDescription: "shout. liest Namen aus deinen Kontakten nur lokal, um sie ins Wörterbuch zu übernehmen. Es werden keine Daten übertragen."
        # Selbstsigniertes Zertifikat → stabile Code-Identität → Accessibility-Freigabe
        # bleibt über alle Rebuilds erhalten (kein ad-hoc "-" mehr).
        CODE_SIGN_IDENTITY: "Flow Lokal Self-Signed"
        CODE_SIGN_STYLE: Manual
        # Nur am App-Target (NICHT global an xcodebuild übergeben — sonst suchen die
        # SwiftPM-Abhängigkeiten die Datei relativ zu ihrem eigenen Checkout-Ordner).
        CODE_SIGN_ENTITLEMENTS: Release/shout.entitlements
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: argmax
        product: WhisperKit
      - package: mlxlm
        product: MLXLLM
      - package: mlxlm
        product: MLXLMCommon
      - package: mlxlm
        product: MLXHuggingFace
      - package: transformers
        product: Tokenizers
      - package: huggingface
        product: HuggingFace
      - package: mlxcore
        product: MLX

  # iOS-App: gleiche lokale Pipeline (WhisperKit + MLX in-process), mobile UI.
  # Teilt die Kern-Dateien aus Sources/FlowLokal (plattformneutral gehalten).
  ShoutMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ShoutMobile
      - path: Sources/FlowLokal
        includes:
          - Transcriber.swift
          - Formatter.swift
          - AudioRecorder.swift
          - PersonalDictionary.swift
          - DictationHistory.swift
          - StatsStore.swift
          - StoreIO.swift
          - SpeechCommands.swift
          - ModelCatalog.swift
          - HuggingFaceModels.swift
          - SoundCues.swift
          - Theme.swift
          - Backup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.shout.ios
        PRODUCT_NAME: "shout"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "shout."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "shout. nimmt dein Mikrofon auf, um Sprache lokal in Text umzuwandeln. Nichts verlässt dein Gerät."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Großes Speicherlimit für die lokalen Modelle (WhisperKit + MLX-LLM).
        CODE_SIGN_ENTITLEMENTS: Release/shout-ios.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5FFT759WM
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: argmax
        product: WhisperKit
      - package: mlxlm
        product: MLXLLM
      - package: mlxlm
        product: MLXLMCommon
      - package: mlxlm
        product: MLXHuggingFace
      - package: transformers
        product: Tokenizers
      - package: huggingface
        product: HuggingFace
      - package: mlxcore
        product: MLX
