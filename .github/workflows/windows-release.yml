# Baut das Windows-Release und veröffentlicht es. Zwei Wege, gleiches Ergebnis:
#
#   1. Tag pushen:  git tag windows-v1.0.0 && git push origin windows-v1.0.0
#   2. Ohne lokales Repo: Actions → „Windows-Release" → „Run workflow",
#      Version eintragen und „veröffentlichen" ankreuzen.
#
# Weg 2 gibt es, weil ein Tag-Push ein lokales Repo und Tag-Schreibrechte
# verlangt — beides hat nicht jeder überall. Den Tag legt dann `gh release
# create` selbst an, und zwar auf GENAU dem Commit, der hier gebaut wurde
# (--target). Ein so gesetzter Tag löst diesen Workflow NICHT erneut aus, weil
# GitHub Ereignisse des eigenen Tokens nicht weiterreicht — genau richtig, sonst
# liefe der Bau zweimal.
#
# Ergebnis: ein GitHub-Release mit shout-win-Setup.exe (zum Herunterladen und
# Installieren) sowie releases.win.json und dem .nupkg — die beiden braucht
# Velopack, damit sich installierte Kopien selbst aktualisieren können.
name: Windows-Release

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 1.3.0)"
        required: true
        default: "1.3.0"
      publish:
        description: "Veröffentlichen — ohne Haken nur bauen und als Artefakt ablegen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Velopack-Werkzeug installieren
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          # Der Ordner für globale dotnet-Werkzeuge liegt auf den Runnern nicht
          # zwangsläufig im PATH — sonst findet release.ps1 „vpk" nicht.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Version aus dem Tag ableiten
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/windows-v*") {
            $version = $env:GITHUB_REF -replace "^refs/tags/windows-v", ""
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      # Vor dem Veröffentlichen prüfen: Ein Release, das die eigenen Tests nicht
      # besteht, soll gar nicht erst gebaut werden.
      - name: Tests
        working-directory: windows
        run: dotnet test tests/Shout.Tests/Shout.Tests.csproj --nologo -v minimal

      - name: Release bauen
        shell: pwsh
        working-directory: windows
        run: ./release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: shout-windows-${{ steps.version.outputs.version }}
          path: windows/release/*

      # Veröffentlicht wird bei einem echten Tag — oder wenn beim Start von Hand
      # ausdrücklich der Haken gesetzt wurde. Ohne beides bleibt es beim Artefakt.
      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/windows-v') || github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @"
          **shout. $version für Windows** — lokale, private Diktier-App.

          ## Installieren
          ``shout-win-Setup.exe`` herunterladen und ausführen. Kein Administrator
          nötig; die .NET-8-Desktop-Runtime wird bei Bedarf mitinstalliert.
          Wer nichts installieren will, nimmt ``shout-win-Portable.zip``.

          ## Aktualisieren
          Installierte Kopien suchen selbst nach neuen Versionen und melden sich,
          sobald eine bereitliegt — Neustart über das Tray-Menü genügt.

          Die übrigen Dateien (``releases.win.json``, ``.nupkg``) gehören zu dieser
          Auto-Aktualisierung und werden nicht von Hand heruntergeladen.
          "@
          # --target: Ohne das legte gh den Tag auf den Kopf des Standard-Zweigs,
          # und der kann beim Start von Hand ein anderer Commit sein als der, der
          # hier gerade gebaut wurde.
          gh release create "windows-v$version" (Get-ChildItem windows/release/* | ForEach-Object { $_.FullName }) `
            --target ${{ github.sha }} `
            --title "shout. $version für Windows" `
            --notes $notes
