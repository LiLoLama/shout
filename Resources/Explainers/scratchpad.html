/* ================================================================

const TL = {

  // 2 · Panel und Diktat

const CAPTIONS = [
  [3.6, 11.75, 'cap2'], [12.3, 17.75, 'cap3'], [18.45, 26.85, 'cap4'], [27.15, 33.6, 'cap5'], [34.1, 37.25, 'cap6']

/* ================================================================
   Helfer: Zahlen, Kurven, Rauschen
   ================================================================ */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (x, a, b) => clamp((x - a) / (b - a));
const E = {
  oC: p => 1 - Math.pow(1 - p, 3),
  iC: p => p * p * p,
  ioC: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  ioS: p => p * p * (3 - 2 * p)
};
// Ein- und Ausblenden über ein Fenster [a, b].
const vis = (x, a, b, fi = 0.4, fo = 0.4) => E.ioC(seg(x, a, a + fi)) * (1 - E.ioC(seg(x, b - fo, b)));
// Tastendruck: unten zwischen d und u.
const pressAt = (x, d, u) => E.oC(seg(x, d - 0.06, d)) * (1 - E.ioC(seg(x, u, u + 0.12)));
const mix = (a, b, p) => `rgb(${Math.round(lerp(a[0], b[0], p))},${Math.round(lerp(a[1], b[1], p))},${Math.round(lerp(a[2], b[2], p))})`;
const hsh = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vn = x => { const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f); return lerp(hsh(i), hsh(i + 1), s); };
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

/* ================================================================
   Zeichenhelfer
   ================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.setAttribute('aria-label', L.aria);
let K = 1;   // Auflösungsfaktor der Leinwand
let t = 0;   // aktuelle Filmzeit

function font(s, w = 500, f = 'sans') { ctx.font = `${w} ${s}px ${FAM[f]}`; }
function lsp(v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v + 'px'; }
function mw(str, s, w = 500, f = 'sans', ls = 0) { font(s, w, f); lsp(ls); const m = ctx.measureText(str).width; lsp(0); return m; }
function tx(str, x, y, o = {}) {
  ctx.save();
  font(o.s ?? 24, o.w ?? 500, o.f ?? 'sans'); lsp(o.ls ?? 0);
  ctx.fillStyle = o.c ?? C.ink;
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.textAlign = o.al ?? 'left';
  ctx.textBaseline = o.bl ?? 'alphabetic';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r) {
  w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRR(x, y, w, h, r, col) { rr(x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); }
function strokeRR(x, y, w, h, r, col, lw = 1.5) { rr(x + lw / 2, y + lw / 2, w - lw, h - lw, r); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }
function shadowed(fn, blur = 50, oy = 20, a = 0.55) {
  ctx.save(); ctx.shadowColor = `rgba(0,0,0,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; fn(); ctx.restore();
}
function glow(x, y, r, a, rgb = RGB.live) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}

// Wortweise umbrechen; liefert jedes Wort mit Lage (Zeile, x).
function wrapWords(str, maxW) {
  const sp = ctx.measureText(' ').width;
  const out = []; let x = 0, line = 0;
  for (const w of str.split(' ')) {
    const ww = ctx.measureText(w).width;
    if (x > 0 && x + ww > maxW) { line++; x = 0; }
    out.push({ w, x, line, ww });
    x += ww + sp;
  }
  return out;
}
// Zeilen mit „- “-Aufzählungen in eine Breite legen.
function layoutDoc(lines, maxW, s, wt, lh, gap, ind) {
  font(s, wt, 'sans');
  const rows = []; let y = 0, idx = 0;
  for (const src of lines) {
    if (!src) { y += gap; continue; }
    const bullet = src.startsWith('- ');
    const body = bullet ? src.slice(2) : src;
    const x0 = bullet ? ind : 0;
    const ws = wrapWords(body, maxW - x0);
    const n = ws[ws.length - 1].line + 1;
    for (let k = 0; k < n; k++) {
      const text = ws.filter(q => q.line === k).map(q => q.w).join(' ');
      rows.push({ text, x: x0, y: y + k * lh, bullet: bullet && k === 0, idx, w: ctx.measureText(text).width });
    }
    y += n * lh; idx++;
  }
  return { rows, h: y };
}
// Ein gesetztes Dokument zeichnen. mode: 'md' (Markdown-Strich), 'rich' (Punkt), 'obs' (violetter Punkt).
function drawDoc(doc, x, y, o) {
  const s = o.s, lh = o.lh;
  for (const r of doc.rows) {
    const a = o.alphaOf ? o.alphaOf(r.idx) : 1;
    if (a <= 0.001) continue;
    const dy = o.dyOf ? o.dyOf(r.idx) : 0;
    const by = y + r.y + lh * 0.72 + dy;
    if (r.bullet) {
      if (o.mode === 'md') tx('-', x, by, { s, w: 500, c: C.mute, a });
      else {
        ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = o.mode === 'obs' ? C.violet : C.ink;
        ctx.beginPath(); ctx.arc(x + o.ind * 0.4, by - s * 0.33, s * 0.13, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    tx(r.text, x + r.x, by, { s, w: o.w ?? 400, c: o.c ?? C.ink, a });
  }
}

/* ---------- Symbole (24er-Raster, Mitte = 0) ---------- */
function star4(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
const ICONS = {
  mic(o) {
    rr(-3.6, -10, 7.2, 12.5, 3.6); o.fill ? ctx.fill() : ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -2, 7, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 5.2); ctx.lineTo(0, 9.5); ctx.moveTo(-4, 9.5); ctx.lineTo(4, 9.5); ctx.stroke();
  },
  pin() {
    ctx.rotate(0.62);
    rr(-3.8, -10.5, 7.6, 8.5, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6.5, -2); ctx.lineTo(6.5, -2); ctx.moveTo(0, -2); ctx.lineTo(0, 10.5); ctx.stroke();
  },
  wand() {
    ctx.lineWidth *= 1.15;
    ctx.beginPath(); ctx.moveTo(-9, 9.5); ctx.lineTo(4.5, -4); ctx.stroke();
    star4(7.5, -7.5, 4.6); star4(-2.5, -8.5, 2.6); star4(9, 2.5, 2.6);
  },
  plus() { ctx.beginPath(); ctx.moveTo(-6.5, 0); ctx.lineTo(6.5, 0); ctx.moveTo(0, -6.5); ctx.lineTo(0, 6.5); ctx.stroke(); },
  sidebar() { rr(-10, -8, 20, 16, 3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-3.5, -8); ctx.lineTo(-3.5, 8); ctx.stroke(); },
  xmark() { ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(4, 4); ctx.moveTo(4, -4); ctx.lineTo(-4, 4); ctx.stroke(); },
  envelope() {
    rr(-10, -7.5, 20, 15, 2.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(0, 1); ctx.lineTo(9, -6); ctx.stroke();
  },
  note() {
    rr(-8, -10, 16, 20, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, -4.5); ctx.lineTo(4, -4.5); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.moveTo(-4, 4.5); ctx.lineTo(1, 4.5); ctx.stroke();
  },
  check() {
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-4.5, 0.3); ctx.lineTo(-1.3, 3.6); ctx.lineTo(4.8, -3.4); ctx.stroke();
  },
  doc() {
    ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(3, -10); ctx.lineTo(8, -5); ctx.lineTo(8, 10); ctx.lineTo(-7, 10); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -10); ctx.lineTo(3, -5); ctx.lineTo(8, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(4, 0); ctx.moveTo(-3.5, 4); ctx.lineTo(2, 4); ctx.stroke();
  },
  folder() {
    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-10, 8); ctx.lineTo(10, 8); ctx.lineTo(10, -4); ctx.lineTo(-1, -4);
    ctx.lineTo(-3, -7); ctx.lineTo(-9, -7); ctx.closePath(); ctx.stroke();
  },
  cloud() {
    ctx.beginPath(); ctx.moveTo(-6, 6); ctx.arc(-6, 1, 5, Math.PI / 2, Math.PI * 1.5); ctx.arc(1, -2, 7, Math.PI * 1.1, Math.PI * 1.95);
    ctx.arc(6.5, 2, 4, -Math.PI / 2, Math.PI / 2); ctx.closePath(); ctx.stroke();
  },
  chevL() { ctx.beginPath(); ctx.moveTo(3, -7); ctx.lineTo(-4, 0); ctx.lineTo(3, 7); ctx.stroke(); },
  chevR() { ctx.beginPath(); ctx.moveTo(-3, -7); ctx.lineTo(4, 0); ctx.lineTo(-3, 7); ctx.stroke(); },
  plane() {
    ctx.beginPath(); ctx.moveTo(-10, -1); ctx.lineTo(10, -8); ctx.lineTo(3, 9); ctx.lineTo(0, 2); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(10, -8); ctx.stroke();
  },
  search() { ctx.beginPath(); ctx.arc(-2, -2, 6.5, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(3, 3); ctx.lineTo(9, 9); ctx.stroke(); }
};
function icon(name, cx, cy, s, col, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.translate(cx, cy); ctx.scale(s / 24, s / 24);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = o.lw ?? 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ICONS[name](o);
  ctx.restore();
}
function spinner(cx, cy, r, a = 1) {
  const step = Math.floor(t * 12);
  ctx.save(); ctx.globalAlpha *= a; ctx.lineCap = 'round'; ctx.lineWidth = r * 0.24;
  for (let i = 0; i < 8; i++) {
    const ang = i / 8 * Math.PI * 2;
    ctx.strokeStyle = `rgba(243,240,236,${0.2 + 0.8 * (((i - step) % 8 + 8) % 8) / 7})`;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5);
    ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r); ctx.stroke();
  }
  ctx.restore();
}
function trafficLights(x, y, r = 7, gap = 22) {
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + i * gap, y, r, 0, Math.PI * 2); ctx.fill(); });
}
function caret(x, y, h, a = 1, blink = true) {
  if (blink && Math.floor(t / 0.53) % 2 === 1) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.live; ctx.fillRect(x, y - h, 2.5, h); ctx.restore();
}
// Ein schlichtes Fenster mit Titelleiste.
function windowChrome(x, y, w, h, title, o = {}) {
  const r = 14, th = o.th ?? 52;
  shadowed(() => fillRR(x, y, w, h, r, o.bg ?? '#1E1E23'), 70, 26, 0.6);
  ctx.save(); rr(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = o.barBg ?? 'rgba(255,255,255,0.035)'; ctx.fillRect(x, y, w, th);
  ctx.fillStyle = C.hair; ctx.fillRect(x, y + th - 1, w, 1);
  ctx.restore();
  strokeRR(x, y, w, h, r, 'rgba(255,255,255,0.10)', 1.5);
  trafficLights(x + 26, y + th / 2);
  if (title) tx(title, x + w / 2, y + th / 2 + 7, { s: 19, w: 600, c: C.mute, al: 'center' });
}

/* ================================================================
   Tastenkappen
   ================================================================ */
const KEY_NAMES = { '⌃': 'control', '⌥': 'option', '⇧': 'shift', '⌘': 'command', '⏎': 'return', '↩': 'return', '⇥': 'tab', '⎋': 'esc', '⌫': 'delete', '␣': 'space' };
function splitKeys(s) {
  const out = []; let rest = '';
  for (const ch of Array.from(s)) { if ('⌃⌥⇧⌘'.includes(ch) && !rest) out.push(ch); else rest += ch; }
  if (rest) out.push(rest);
  return out;
}
function capWidth(glyph, size) {
  if (Array.from(glyph).length <= 1) return size;
  return Math.max(size, mw(glyph, size * 0.36, 500) + size * 0.5);
}
function keycap(x, cy, w, s, glyph, press) {
  const depth = s * 0.1, off = press * depth * 0.75, r = s * 0.2;
  const y = cy - s / 2;
  fillRR(x, y + depth, w, s, r, '#070709');
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6 - off * 0.5;
  const g = ctx.createLinearGradient(0, y + off, 0, y + off + s);
  g.addColorStop(0, '#3B3B42'); g.addColorStop(1, '#27272C');
  rr(x, y + off, w, s, r); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  strokeRR(x, y + off, w, s, r, press > 0.04 ? `rgba(255,74,10,${0.35 + 0.6 * press})` : 'rgba(255,255,255,0.13)', 2);
  const single = Array.from(glyph).length <= 1;
  const name = KEY_NAMES[glyph];
  const col = mix(RGB.ink, RGB.live, press);
  const gy = y + off + s * (name ? 0.42 : 0.5);
  tx(glyph, x + w / 2, gy, { s: single ? s * 0.42 : s * 0.36, w: single && !/[A-Z0-9]/.test(glyph) ? 400 : 500, c: col, al: 'center', bl: 'middle' });
  if (name) tx(name, x + w / 2, y + off + s * 0.82, { s: Math.max(12, s * 0.15), w: 500, f: 'sans', c: C.mute, al: 'center', bl: 'middle' });
}
// Eine Reihe Kappen ab x; gibt die Breite zurück. press: 0…1.
function keyRow(str, x, cy, size, press, gap = 14) {
  const caps = splitKeys(str);
  const ws = caps.map(g => capWidth(g, size));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (caps.length - 1);
  glow(x + total / 2, cy + size * 0.1, total * 0.75, 0.16 * press);
  let cx = x;
  caps.forEach((g, i) => { keycap(cx, cy, ws[i], size, g, press); cx += ws[i] + gap; });
  return total;
}
function rowWidth(str, size, gap = 14) {
  const caps = splitKeys(str);
  return caps.reduce((a, g) => a + capWidth(g, size), 0) + gap * (caps.length - 1);
}

const ED = { s: 24, lh: 36, gap: 14, ind: 26, pad: 30 };

  if (t < TL.panelOut) { const p = E.oC(seg(t, TL.panelIn, TL.panelIn + 0.55)); return { a: p, dx: (1 - p) * 56, s: 1 }; }
  if (t < TL.panelBack) { const p = E.ioC(seg(t, TL.panelOut, TL.panelOut + 0.42)); return { a: 1 - p, dx: p * 56, s: 1 }; }
  if (t < TL.sendTap + 0.08) { const p = E.oC(seg(t, TL.panelBack, TL.panelBack + 0.55)); return { a: p, dx: (1 - p) * 56, s: 1 }; }

const noticeH = () => 50 * E.ioC(seg(t, TL.working, TL.working + 0.3));
const wordTime = i => {

/* ---------- Pille mit Pegel (Maße aus RecordingIndicator.swift) ---------- */
const PILL_W = [0.55, 0.78, 0.93, 1.0, 0.93, 0.78, 0.55];
function pillAmount(on, off) { return E.oC(seg(t, on + 0.08, on + 0.33)) * (1 - E.iC(seg(t, off, off + 0.22))); }
function pill(on, off) {
  const a = pillAmount(on, off);
  if (a <= 0.001) return;
  const S = 2.3, w = 111 * S, h = 34 * S;
  const { x: cx, y: cy } = PILL_POS;
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.translate(cx, cy); const sc = lerp(0.86, 1, a); ctx.scale(sc, sc);
  shadowed(() => fillRR(-w / 2, -h / 2, w, h, h / 2, 'rgba(40,40,46,0.96)'), 24, 6, 0.6);
  strokeRR(-w / 2, -h / 2, w, h, h / 2, 'rgba(255,255,255,0.11)', 1.5);
  const bw = 2.8 * S, gap = 2.5 * S, total = 7 * bw + 6 * gap;
  const env = 0.45 + 0.55 * vn(t * 2.6 + on);
  for (let i = 0; i < 7; i++) {
    const lv = clamp((0.3 + 0.7 * vn(t * 6 + i * 0.9 + on * 3)) * PILL_W[i] * env);
    const len = (3 + 18 * lv) * S;
    const bx = -total / 2 + bw / 2 + i * (bw + gap);
    ctx.save(); ctx.shadowColor = 'rgba(255,74,10,0.55)'; ctx.shadowBlur = 4 * S;
    fillRR(bx - bw / 2, -len / 2, bw, len, bw / 2, C.live);
    ctx.restore();
  }
  ctx.restore();
}

  const span = TL.inboxOff - 0.4 - (TL.inboxOn + 0.5);

function keysScene(str, tin, tout, presses, label) {
  const a = E.oC(seg(t, tin, tin + 0.35)) * (1 - E.ioC(seg(t, tout, tout + 0.4)));
  if (a <= 0) return;
  let press = 0;
  for (const [d, u] of presses) press = Math.max(press, pressAt(t, d, u));
  const natural = rowWidth(str, KEYS_POS.size);
  const size = KEYS_POS.size * Math.min(1, 440 / natural);
  ctx.save(); ctx.globalAlpha *= a;
  const dy = (1 - E.oC(seg(t, tin, tin + 0.45))) * 18;
  const wRow = keyRow(str, KEYS_POS.x, KEYS_POS.cy + dy, size, press);
  if (label) {
    const pillLeft = PILL_POS.x - 111 * 2.3 / 2 - 28;
    for (const [text, l0, l1] of label) {
      const la = vis(t, l0, l1, 0.2, 0.25);
      if (la <= 0) continue;

/* ================================================================
   Ton — WebAudio, dieselbe Partitur für Wiedergabe und Export
   ================================================================ */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function buildAudio(ac, dest, from, offline) {
  const now = ac.currentTime;
  const base = offline ? 0 : now + 0.06;
  const at = tl => base + (tl - from);
  const live = tl => at(tl) >= now - 0.001;
  const srcs = [];

  const nb = ac.createBuffer(2, ac.sampleRate * 2, ac.sampleRate);
  { const r = rng(9); for (let c = 0; c < 2; c++) { const d = nb.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; } }
  const ir = ac.createBuffer(2, Math.floor(ac.sampleRate * 2.2), ac.sampleRate);
  { const r = rng(21); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / d.length, 3.4); } }

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
  const out = ac.createGain(); out.gain.value = 3.4;
  comp.connect(out); out.connect(dest);
  const bus = ac.createGain(); bus.connect(comp);
  const rev = ac.createConvolver(); rev.buffer = ir;
  const revOut = ac.createGain(); revOut.gain.value = 0.3; rev.connect(revOut); revOut.connect(comp);
  const send = (node, amt) => { const g = ac.createGain(); g.gain.value = amt; node.connect(g); g.connect(rev); };
  const noise = (t0, dur) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; s.start(t0, (t0 * 7.3) % 1.5); s.stop(t0 + dur + 0.05); srcs.push(s); return s; };
  const osc = (type, f, t0, t1) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.start(t0); o.stop(t1); srcs.push(o); return o; };

  // Weicher Tastenanschlag: gedämpftes Rauschen, ein Hauch Körper.
  function click(tl, v = 0.07, f = 1100) {
    if (!live(tl)) return; const t0 = at(tl);
    const j = hsh(tl * 131.7);
    const s = noise(t0, 0.04);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.9 + j * 0.2); bp.Q.value = 1.5;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.0015); g.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.024);
    s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(bus);
    const o = osc('sine', 240 * (0.95 + j * 0.1), t0, t0 + 0.03);
    const g2 = ac.createGain(); g2.gain.setValueAtTime(v * 0.5, t0); g2.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.02);
    o.connect(g2); g2.connect(bus); send(g, 0.08);
  }
  // Ein sanfter Ton mit Obertönen.
  function tone(tl, f, dur, v, type = 'sine', rv = 0.4) {
    if (!live(tl)) return; const t0 = at(tl);
    const o = osc(type, f, t0, t0 + dur + 0.05);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(bus); send(g, rv);
  }
  const twoTone = tl => { tone(tl, mtof(79), 0.18, 0.07); tone(tl + 0.09, mtof(86), 0.28, 0.07); };
  const doneTone = tl => { tone(tl, mtof(86), 0.16, 0.035); tone(tl + 0.08, mtof(79), 0.3, 0.035); };
  const ping = tl => { tone(tl, mtof(91), 1.3, 0.08); tone(tl, mtof(98), 0.7, 0.025); tone(tl + 0.004, mtof(103), 0.35, 0.012, 'triangle'); };
  const blip = (tl, m, v = 0.035) => tone(tl, mtof(m), 0.35, v, 'sine', 0.5);
  // Luftiges Wischen beim Ein- und Ausblenden des Panels.
  function whoosh(tl, dur = 0.5, v = 0.035, up = true) {
    if (!live(tl)) return; const t0 = at(tl);
    const s = noise(t0, dur);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(up ? 500 : 1600, t0); bp.frequency.exponentialRampToValueAtTime(up ? 1600 : 500, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + dur * 0.4); g.gain.linearRampToValueAtTime(0, t0 + dur);
    s.connect(bp); bp.connect(g); g.connect(bus); send(g, 0.3);
  }
  // Leiser Klangteppich: zwei weiche Akkorde im Wechsel.
  function pad(t1, t2, notes, v, rel = 1.6) {
    if (!live(t2 + rel)) return;
    const a = Math.max(at(t1), now), b = at(t2), late = at(t1) < now;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.4;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(v, a + (late ? 0.4 : 1.6));
    g.gain.setValueAtTime(v, Math.max(a + 1.61, b)); g.gain.linearRampToValueAtTime(0, Math.max(a + 1.7, b) + rel);
    lp.connect(g); g.connect(bus); send(g, 0.6);
    const end = Math.max(a + 1.7, b) + rel + 0.1;
    notes.forEach(m => [-5, 5].forEach(dc => {
      const o = osc('triangle', mtof(m), a, end); o.detune.value = dc;
      const og = ac.createGain(); og.gain.value = 1 / (notes.length * 2); o.connect(og); og.connect(lp);
    }));
  }

  // --- Partitur ---
  const CH = [[41, 53, 57, 60, 64], [38, 50, 57, 60, 65], [46, 50, 58, 62, 65], [43, 55, 58, 62, 67]];
  for (let i = 0, tt = 0.2; tt < TL.endCard; i++, tt += 8) pad(tt, Math.min(tt + 8, TL.endCard + 0.3), CH[i % 4], 0.055, 2.2);
  // 2 · Panel und Diktat
  click(TL.padTap - 0.03); click(TL.padTap + 0.12, 0.04, 1500);
  whoosh(TL.panelIn - 0.05, 0.5, 0.03, true);
  click(TL.holdOn - 0.03); twoTone(TL.holdOn + 0.1);
  click(TL.holdOff, 0.04, 1500); doneTone(TL.holdOff + 0.12);
  // 3 · Eingang
  whoosh(TL.panelOut, 0.45, 0.025, false);
  click(TL.inboxOn - 0.03); twoTone(TL.inboxOn + 0.1);
  click(TL.inboxOff, 0.04, 1500);
  blip(TL.toastIn + 0.05, 84, 0.03); blip(TL.toastIn + 0.15, 88, 0.025);
  // 4 · Zauberstab
  whoosh(TL.panelBack - 0.05, 0.5, 0.03, true);
  click(TL.wandClick, 0.05, 2200); click(TL.itemClick, 0.05, 2200);
  [76, 79, 84, 88].forEach((m, i) => blip(TL.done + i * 0.09, m, 0.022));
  // 5 · Ablegen
  click(TL.sendTap - 0.03); click(TL.sendTap + 0.12, 0.04, 1500);
  whoosh(TL.sendTap + 0.08, 0.4, 0.02, false);
  ping(TL.pasted);
  // 6 · Dateien und leiser Abschluss
  whoosh(TL.files, 0.6, 0.02, true);
  pad(TL.endCard + 0.3, DUR - 0.4, [53, 60, 64, 67, 69], 0.08, 1.2);
  [72, 76, 79, 84].forEach((m, i) => blip(TL.endCard + 0.5 + i * 0.16, m, 0.028));

  return { out, srcs };
}

/* ---------- Export: Tonspur als WAV ---------- */
async function renderAudioWav() {
  const sr = 48000;
  const oc = new OfflineAudioContext(2, Math.ceil(DUR * sr), sr);
  buildAudio(oc, oc.destination, 0, true);
  const buf = await oc.startRendering();
  const n = buf.length, Lc = buf.getChannelData(0), Rc = buf.getChannelData(1);
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    dv.setInt16(o, clamp(Lc[i], -1, 1) * 32767, true); dv.setInt16(o + 2, clamp(Rc[i], -1, 1) * 32767, true); o += 4;
  }

  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

}

/* ================================================================
   Wiedergabe — Uhr über AudioContext (mit Ton) oder performance.now()
   ================================================================ */
let playing = false, cur = 0, tStart = 0, wallStart = 0, acStart = 0, raf = 0, ac = null, nodes = null;

function post(msg) {
  try { const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.explainer; if (h) h.postMessage(msg); } catch (e) { /* ohne App */ }
}
function postState() { post({ type: 'state', playing, muted, t: Math.round(cur * 100) / 100 }); }

function clock() {
  if (nodes && ac && ac.state === 'running') return tStart + Math.max(0, ac.currentTime - acStart);
  return tStart + (performance.now() - wallStart) / 1000;
}
function rebase() { const x = clock(); tStart = x; wallStart = performance.now(); return x; }
function stopAudio() {
  if (!nodes) return;
  const v = nodes; nodes = null;
  try {
    v.out.gain.cancelScheduledValues(ac.currentTime);
    v.out.gain.setValueAtTime(v.out.gain.value, ac.currentTime);
    v.out.gain.linearRampToValueAtTime(0, ac.currentTime + 0.03);
  } catch (e) { /* schon weg */ }
  setTimeout(() => { v.srcs.forEach(s => { try { s.stop(); } catch (e) { /* nie gestartet */ } }); try { v.out.disconnect(); } catch (e) { /* egal */ } }, 90);
}
function startAudio() {
  if (muted || !playing) return;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      // Läuft der Kontext erst später an (Autoplay-Regeln), ab dort einsetzen.
      ac.onstatechange = () => { if (ac.state === 'running' && playing && !muted && !nodes) startAudio(); };
    }
    if (ac.state !== 'running') { ac.resume().catch(() => { /* bleibt stumm */ }); return; }
    const from = rebase();
    if (from >= DUR) return;
    nodes = buildAudio(ac, ac.destination, from, false);
    tStart = from; acStart = ac.currentTime + 0.06;
  } catch (e) { nodes = null; }
}
function tick() {
  if (!playing) return;
  cur = clock();
  if (cur >= DUR) {
    cur = DUR; playing = false; stopAudio(); render(cur);
    post({ type: 'ended' }); postState();
    return;
  }
  render(cur);
  raf = requestAnimationFrame(tick);
}
function play() {
  if (playing) return;
  if (cur >= DUR - 0.05) cur = 0;
  playing = true; tStart = cur; wallStart = performance.now();
  startAudio();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  postState();
}
function pause() {
  if (playing) cur = clock();
  playing = false; cancelAnimationFrame(raf); stopAudio();
  render(cur); postState();
}
function restart() {
  playing = false; cancelAnimationFrame(raf); stopAudio();
  cur = 0; play();
}
function setMuted(b) {
  muted = !!b;
  if (playing) { stopAudio(); rebase(); if (!muted) startAudio(); }
  postState();
}

/* ---------- Größe: 16:10 in das Fenster, Gerätepixel beachten ---------- */
function resize() {
  if (EXPORT) { K = 1; cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px'; return; }
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = Math.max(1, Math.min(vw, vh * W / H)), ch = cw * H / W;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  K = bw / W;
  if (!playing) render(cur);
}

/* ---------- Start ---------- */
function prepare() {
  font(ED.s, 400);
  dictWords = wrapWords(L.dictated, PANEL.w - 2 * ED.pad);
  panelDoc = layoutDoc(L.mail, PANEL.w - 2 * ED.pad, ED.s, 400, ED.lh, ED.gap, ED.ind);
  mailDoc = layoutDoc(L.mail, MAILW.w - 72, MAIL_BODY.s, 400, MAIL_BODY.lh, MAIL_BODY.gap, MAIL_BODY.ind);
  obsDoc = layoutDoc(L.mail, OBS.w - 46 - 196 - 68, OBS_BODY.s, 400, OBS_BODY.lh, OBS_BODY.gap, OBS_BODY.ind);
  font(26, 400);
  saidWords = L.inboxSaid.split(' ').map(w => ({ w, ww: ctx.measureText(w).width }));
}

window.explainer = {
  ready: false,
  duration: DUR,
  play, pause, restart, setMuted,
  frame(x, q = 0.92) { render(x); return cv.toDataURL('image/jpeg', q).split(',')[1]; },
  renderAudio: renderAudioWav
};
prepare();
window.addEventListener('resize', resize);
resize();
render(0);
window.explainer.ready = true;
if (AUTOPLAY) play(); else postState();
})();
</script>
