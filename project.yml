name: FlowLokal
options:
  bundleIdPrefix: com.inthezone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

schemes:
  ShoutMobile:
    build:
      # Implizite Abhängigkeiten MÜSSEN an sein, sonst baut Xcode das MLX-
      # Makro-Target (MLXHuggingFaceMacros) ohne swift-syntax → Build bricht ab.
      buildImplicitDependencies: true
      parallelizeBuild: true
      targets:
        ShoutMobile: all
    run:
      config: Debug
    archive:
      config: Release
  ShoutTests:
    build:
      targets:
        ShoutTests: [test]
    test:
      config: Debug
      targets:
        - ShoutTests

packages:
  argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  mlxlm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  # Explizit >= 0.31.6: erst ab dort ist mlx-swifts encuda-Hilfstool mit
  # #if os(macOS) geguardet — 0.31.5 bricht den iOS-Build (Foundation.Process).
  mlxcore:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  # swift-transformers auf WhisperKits Range gepinnt, damit WhisperKit und der
  # MLX-Macro-Stack im selben Binary koexistieren (siehe Package.swift-Kommentar).
  transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: 1.1.6
    maxVersion: 1.2.0
  huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  # Auto-Update für die macOS-App (Appcast + EdDSA-signierte Updates).
  sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  FlowLokal:
    type: application
    platform: macOS
    sources:
      - Sources/FlowLokal
      - Resources/Assets.xcassets
      # Klang-Signale (Start, Stopp, Fehler). Nur die MP3s — die .asd-Dateien
      # daneben sind Ableton-Analysedateien und gehören nicht ins Bundle.
      - path: Resources/Audio
        includes:
          - "*.mp3"
    # Explizite Info.plist (von xcodegen generiert), damit die Sparkle-Keys
    # SUFeedURL/SUPublicEDKey gesetzt werden können — die gehen NICHT über die
    # INFOPLIST_KEY_-Build-Settings (nur Apple-bekannte Schlüssel).
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: "shout."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "shout. nimmt dein Mikrofon auf, um Sprache lokal in Text umzuwandeln."
        NSContactsUsageDescription: "shout. liest Namen aus deinen Kontakten nur lokal, um sie ins Wörterbuch zu übernehmen. Es werden keine Daten übertragen."
        # Ohne diesen Schlüssel kann die App die Erlaubnis zum Mitschnitt des
        # Systemtons nicht einmal anfragen — der Abgriff liefert dann stillschweigend
        # Nullen statt eines Fehlers. Steht in keinem Xcode-Menü.
        NSAudioCaptureUsageDescription: "shout. schneidet den Ton anderer Programme mit, um Online-Meetings lokal zu transkribieren. Nichts verlässt deinen Rechner."
        # Sparkle Auto-Update
        SUFeedURL: "https://raw.githubusercontent.com/LiLoLama/shout/main/appcast.xml"
        SUPublicEDKey: "K4fmCpqGG4t4iy6K9FkJqr0xLJddTyWtUBiKWWoxmMI="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Nur Apple Silicon: MLX/WhisperKit laufen nicht auf Intel. arm64-only sorgt
        # dafür, dass macOS die App auf Intel-Macs gar nicht erst startet (klare
        # „nicht unterstützt"-Meldung statt Crash beim Modell-Laden).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        # Bundle-ID bewusst unverändert (com.inthezone.flowlokal), damit die
        # bestehende Accessibility-Freigabe trotz Umbenennung erhalten bleibt.
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.flowlokal
        # Datei-/Produktname ohne Punkt (sonst "shout..app"); Anzeigename mit Punkt.
        PRODUCT_NAME: "shout"
        MARKETING_VERSION: "1.8.2"
        CURRENT_PROJECT_VERSION: "19"
        # Selbstsigniertes Zertifikat → stabile Code-Identität → Accessibility-Freigabe
        # bleibt über alle Rebuilds erhalten (kein ad-hoc "-" mehr).
        CODE_SIGN_IDENTITY: "Flow Lokal Self-Signed"
        CODE_SIGN_STYLE: Manual
        # Nur am App-Target (NICHT global an xcodebuild übergeben — sonst suchen die
        # SwiftPM-Abhängigkeiten die Datei relativ zu ihrem eigenen Checkout-Ordner).
        CODE_SIGN_ENTITLEMENTS: Release/shout.entitlements
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: argmax
        product: WhisperKit
      # Sprechertrennung (Pyannote/CoreML). Die Modelle lädt
      # SpeakerKit bei der ersten Nutzung selbst von Hugging Face.
      - package: argmax
        product: SpeakerKit
      - package: mlxlm
        product: MLXLLM
      - package: mlxlm
        product: MLXLMCommon
      - package: mlxlm
        product: MLXHuggingFace
      - package: transformers
        product: Tokenizers
      - package: huggingface
        product: HuggingFace
      - package: mlxcore
        product: MLX
      - package: sparkle
        product: Sparkle

  # iOS-App: gleiche lokale Pipeline (WhisperKit + MLX in-process), mobile UI.
  # Teilt die Kern-Dateien aus Sources/FlowLokal (plattformneutral gehalten).
  ShoutMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ShoutMobile
      - path: Sources/Shared
      # Eigener iOS-Asset-Katalog. Der bestehende Katalog unter Resources/
      # enthält ausschließlich das macOS-App-Icon.
      - path: Resources/iOSAssets.xcassets
      # Dieselben Klang-Signale wie am Mac.
      - path: Resources/Audio
        includes:
          - "*.mp3"
      - path: Sources/FlowLokal
        includes:
          - Localization.swift
          - Transcriber.swift
          - Formatter.swift
          # Von Transcriber bzw. Formatter mitbenutzt (Datei-Transkription am Mac);
          # beide sind plattformneutral und ziehen nichts weiter nach.
          - TranscriptSegment.swift
          - TranscriptLayout.swift
          - TranscriptMinutes.swift
          - MediaDecoder.swift
          - SubtitleWriter.swift
          - TranscriptExport.swift
          - FileTranscriptionQueue.swift
          - TranscriptStore.swift
          - MeetingRecorder.swift
          - SpeakerAssignment.swift
          - SpeakerSeparator.swift
          - TextChunker.swift
          - AudioRecorder.swift
          - PersonalDictionary.swift
          - DictationHistory.swift
          - StatsStore.swift
          - StoreIO.swift
          - SpeechCommands.swift
          - ModelCatalog.swift
          - HuggingFaceModels.swift
          - SoundCues.swift
          - Theme.swift
          - Backup.swift
    # Explizite Info.plist statt GENERATE_INFOPLIST_FILE — nötig für das
    # URL-Schema „shout://" (CFBundleURLTypes), über das die Tastatur die App öffnet.
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: "shout."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "shout. nimmt dein Mikrofon auf, um Sprache lokal in Text umzuwandeln. Nichts verlässt dein Gerät."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Für iPad-Multitasking verlangt App Store Connect Unterstützung aller
        # vier Geräteausrichtungen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.inthezone.shout
            CFBundleURLSchemes: [shout]
        # Ohne diesen Modus endet ein Meeting-Mitschnitt, sobald das iPhone
        # gesperrt wird oder die App in den Hintergrund geht.
        UIBackgroundModes:
          - audio
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.shout.ios
        PRODUCT_NAME: "shout"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Großes Speicherlimit für die lokalen Modelle (WhisperKit + MLX-LLM).
        CODE_SIGN_ENTITLEMENTS: Release/shout-ios.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5FFT759WM
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: argmax
        product: WhisperKit
      # Sprechertrennung auch am iPhone (SpeakerKit unterstuetzt iOS ab 16).
      - package: argmax
        product: SpeakerKit
      - package: mlxlm
        product: MLXLLM
      - package: mlxlm
        product: MLXLMCommon
      - package: mlxlm
        product: MLXHuggingFace
      - package: transformers
        product: Tokenizers
      - package: huggingface
        product: HuggingFace
      - package: mlxcore
        product: MLX
      # Tastatur-Erweiterung in die App einbetten.
      - target: ShoutKeyboard
        embed: true

  # Tastatur-Erweiterung: Diktier-Tastatur für beliebige Apps. Bewusst schlank
  # (KEINE Modelle/MLX — Tastaturen haben ein enges Speicherlimit): öffnet zum
  # Aufnehmen die Haupt-App und fügt das Ergebnis aus der App Group ein.
  ShoutKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ShoutKeyboard
      - path: Sources/Shared
      # Oberflächensprache — dieselbe Tabelle wie App und Mac.
      - path: Sources/FlowLokal/Localization.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.shout.ios.keyboard
        PRODUCT_NAME: ShoutKeyboard
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ShoutKeyboard/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Release/shout-keyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5FFT759WM
        SWIFT_VERSION: "5.10"

  # Reine Logik-Tests: kompiliert NUR die abhängigkeitsfreien Dateien mit, damit
  # die Tests ohne WhisperKit/MLX in Sekunden laufen (und ohne Host-App).
  ShoutTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShoutTests
      - path: Sources/FlowLokal/TranscriptSegment.swift
      - path: Sources/FlowLokal/SubtitleWriter.swift
      - path: Sources/FlowLokal/TextChunker.swift
      - path: Sources/FlowLokal/TranscriptExport.swift
      - path: Sources/FlowLokal/TranscriptLayout.swift
      - path: Sources/FlowLokal/TranscriptMinutes.swift
      - path: Sources/FlowLokal/SpeakerAssignment.swift
      - path: Sources/FlowLokal/MediaDecoder.swift
      - path: Sources/FlowLokal/TranscriptStore.swift
      - path: Sources/FlowLokal/MeetingRecorder.swift
      # Vom MeetingRecorder mitbenutzt; nur System-Frameworks, keine Pakete.
      - path: Sources/FlowLokal/SystemAudioTap.swift
      - path: Sources/FlowLokal/PillPlacement.swift
      - path: Sources/FlowLokal/StoreIO.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inthezone.shout.tests
        PRODUCT_NAME: ShoutTests
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
